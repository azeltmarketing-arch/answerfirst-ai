<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnswerFirst AI — Manager Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #0a0a0f; 
            color: #e2e8f0; 
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* Top Navigation */
        .topnav { 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            height: 64px; 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(51, 65, 85, 0.4); 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 0 32px;
            z-index: 1000;
        }
        
        .logo { 
            font-size: 1.2rem; 
            font-weight: 800; 
            color: #f1f5f9; 
            letter-spacing: -0.5px;
        }
        
        .logo-icon {
            width: 32px; 
            height: 32px; 
            background: linear-gradient(135deg, #38bdf8, #0ea5e9); 
            border-radius: 8px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1rem; 
            font-weight: 800; 
            color: #0a0a0f; 
            margin-right: 10px;
        }
        
        .live-indicator {
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 0.8rem; 
            color: #64748b; 
            font-weight: 500;
        }
        
        .live-dot {
            width: 6px; 
            height: 6px; 
            background: #10b981; 
            border-radius: 50%; 
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        /* Main */
        .main { 
            padding: 96px 40px 40px; 
            min-height: 100vh; 
            width: 100%; 
        }
        
        .main-container {
            max-width: 1440px; 
            margin: 0 auto; 
            width: 100%; 
        }
        
        /* Section Title */
        .section-title { 
            font-size: 1.7rem; 
            font-weight: 800; 
            margin-bottom: 24px; 
            color: #f1f5f9; 
            letter-spacing: -0.5px;
        }
        
        /* Cards - Minimalist */
        .card { 
            background: rgba(30, 41, 59, 0.5); 
            border: 1px solid rgba(51, 65, 85, 0.4); 
            border-radius: 16px; 
            padding: 24px; 
            margin-bottom: 20px; 
            backdrop-filter: blur(10px); 
            transition: all 0.3s ease; 
        }
        
        .card:hover {
            border-color: rgba(56, 189, 248, 0.3); 
            transform: translateY(-2px); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); 
        }
        
        .card-title { 
            font-size: 0.75rem; 
            color: #64748b; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 12px; 
            font-weight: 600;
        }
        
        .card-value { 
            font-size: 2.2rem; 
            font-weight: 800; 
            color: #f1f5f9; 
            letter-spacing: -1px;
        }
        
        .card-change { 
            font-size: 0.8rem; 
            margin-top: 8px; 
            font-weight: 500;
        }
        
        .positive { color: #10b981; }
        .negative { color: #ef4444; }
        
        /* Grid */
        .grid-4 { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 16px; 
            margin-bottom: 24px; 
        }
        
        .grid-2 { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            margin-bottom: 24px; 
        }
        
        /* Buttons */
        .btn { 
            padding: 10px 20px; 
            border-radius: 10px; 
            border: none; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 0.85rem; 
            transition: all 0.2s ease; 
            font-family: 'Inter', sans-serif; 
        }
        
        .btn-primary { 
            background: #38bdf8; 
            color: #0a0a0f; 
        }
        
        .btn-primary:hover {
            background: #0ea5e9; 
            transform: translateY(-1px); 
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3); 
        }
        
        .btn-secondary { 
            background: rgba(51, 65, 85, 0.3); 
            color: #e2e8f0; 
            border: 1px solid rgba(51, 65, 85, 0.5); 
        }
        
        .btn-secondary:hover {
            background: rgba(51, 65, 85, 0.5); 
        }
        
        /* Tables - Minimalist */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.85rem; 
        }
        
        th { 
            text-align: left; 
            padding: 14px 12px; 
            color: #64748b; 
            font-weight: 600; 
            border-bottom: 1px solid rgba(51, 65, 85, 0.5); 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        
        td { 
            padding: 14px 12px; 
            border-bottom: 1px solid rgba(30, 41, 59, 0.5); 
        }
        
        tr { 
            cursor: pointer; 
            transition: background 0.2s ease; 
        }
        
        tr:hover { 
            background: rgba(56, 189, 248, 0.05); 
        }
        
        /* Status Badges */
        .badge { 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 600; 
            letter-spacing: 0.3px; 
            white-space: nowrap;
        }
        
        .badge-green { 
            background: rgba(16, 185, 129, 0.15); 
            color: #10b981; 
            border: 1px solid rgba(16, 185, 129, 0.3); 
        }
        
        .badge-yellow { 
            background: rgba(245, 158, 11, 0.15); 
            color: #f59e0b; 
            border: 1px solid rgba(245, 158, 11, 0.3); 
        }
        
        .badge-red { 
            background: rgba(239, 68, 68, 0.15); 
            color: #ef4444; 
            border: 1px solid rgba(239, 68, 68, 0.3); 
        }
        
        .badge-blue { 
            background: rgba(56, 189, 248, 0.15); 
            color: #38bdf8; 
            border: 1px solid rgba(56, 189, 248, 0.3); 
        }
        
        .badge-gray { 
            background: rgba(100, 116, 139, 0.15); 
            color: #94a3b8; 
            border: 1px solid rgba(100, 116, 139, 0.3); 
        }
        
        /* Form Controls */
        .control-panel {
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            align-items: center; 
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex; 
            gap: 10px; 
            align-items: center;
        }
        
        .form-group input, .form-group select {
            padding: 8px 12px; 
            border-radius: 8px; 
            border: 1px solid rgba(51, 65, 85, 0.6); 
            background: rgba(15, 23, 42, 0.7); 
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif; 
            font-size: 0.85rem;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none; 
            border-color: rgba(56, 189, 248, 0.5);
        }
        
        /* Progress */
        .progress-bar {
            width: 100%; 
            height: 4px; 
            background: rgba(51, 65, 85, 0.3); 
            border-radius: 2px; 
            overflow: hidden; 
            margin-top: 12px;
        }
        
        .progress-fill {
            height: 100%; 
            background: linear-gradient(90deg, #38bdf8, #0ea5e9); 
            transition: width 0.3s ease;
        }
        
        /* Log */
        .log {
            background: rgba(15, 23, 42, 0.7); 
            border: 1px solid rgba(51, 65, 85, 0.4); 
            border-radius: 12px; 
            padding: 16px; 
            font-family: 'Courier New', monospace; 
            font-size: 0.8rem; 
            color: #94a3b8; 
            max-height: 300px; 
            overflow-y: auto;
            margin-top: 16px;
        }
        
        .log-entry { 
            margin-bottom: 4px; 
            padding: 2px 0;
        }
        
        .log-success { color: #10b981; }
        .log-skip { color: #f59e0b; }
        .log-error { color: #ef4444; }
        .log-info { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="topnav">
        <div class="logo">
            <span class="logo-icon">A</span>
            AnswerFirst AI — Manager Hub
        </div>
        <div class="live-indicator">
            <span class="live-dot"></span>
            <span id="hub-status">Local hub ready</span>
        </div>
    </div>

    <div class="main">
        <div class="main-container">
            <!-- Stats Section -->
            <h1 class="section-title">Prospecting Dashboard</h1>
            
            <div class="grid-4">
                <div class="card">
                    <div class="card-title">Total Prospects</div>
                    <div class="card-value" id="total-prospects">0</div>
                    <div class="card-change positive">All-time</div>
                </div>
                <div class="card">
                    <div class="card-title">New Leads</div>
                    <div class="card-value" id="new-leads">0</div>
                    <div class="card-change positive">Uncontacted</div>
                </div>
                <div class="card">
                    <div class="card-title">Avg Fit Score</div>
                    <div class="card-value" id="avg-fit">0</div>
                    <div class="card-change positive">Quality score</div>
                </div>
                <div class="card">
                    <div class="card-title">Qualified (65+)</div>
                    <div class="card-value" id="qualified-count">0</div>
                    <div class="card-change positive">Ready to contact</div>
                </div>
            </div>

            <!-- Discovery Control -->
            <div class="card">
                <div class="card-title">Auto Discover Leads</div>
                <div class="control-panel">
                    <div class="form-group">
                        <input type="text" id="niche" placeholder="Niche" value="restaurant">
                        <input type="text" id="location" placeholder="Location" value="Pico Rivera CA">
                        <input type="number" id="num-results" placeholder="# Results" value="10" min="1" max="50" style="width: 120px;">
                    </div>
                    <button class="btn-primary" id="discover-btn" onclick="startDiscovery()">🔍 Scout Now</button>
                    <button class="btn-secondary" onclick="exportCsv()">📊 Export CSV</button>
                    <button class="btn-secondary" onclick="refreshLeads()">🔄 Refresh</button>
                </div>
                <div class="progress-bar" id="progress-bar" style="display: none;">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
                <div class="log" id="log" style="display: none;"></div>
            </div>

            <!-- Leads Table -->
            <div class="card">
                <div class="card-title">Discovered Prospects</div>
                <div style="overflow-x: auto;">
                    <table id="leads-table">
                        <thead>
                            <tr>
                                <th>Business</th>
                                <th>Website</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Niche</th>
                                <th>Fit</th>
                                <th>Pain</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="leads-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:5050/api';
        let discovering = false;
        
        function addLog(message, type = 'info') {
            const log = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }
        
        async function startDiscovery() {
            if (discovering) return;
            discovering = true;
            
            const btn = document.getElementById('discover-btn');
            const log = document.getElementById('log');
            const progressBar = document.getElementById('progress-bar');
            const progressFill = document.getElementById('progress-fill');
            
            btn.textContent = 'Discovering...';
            btn.disabled = true;
            log.style.display = 'block';
            progressBar.style.display = 'block';
            log.innerHTML = '';
            
            const niche = document.getElementById('niche').value || 'restaurant';
            const location = document.getElementById('location').value || 'Pico Rivera CA';
            const numResults = parseInt(document.getElementById('num-results').value) || 10;
            
            addLog(`Starting discovery: ${niche} in ${location} (${numResults} results)`, 'info');
            
            try {
                const resp = await fetch(`${API_BASE}/discover-leads`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ niche, location, num_results: numResults })
                });
                
                const data = await resp.json();
                
                if (resp.ok) {
                    addLog(`Discovery complete! Added ${data.added || 0} new prospects.`, 'success');
                    addLog(`Scraped ${data.total_scraped || 0} businesses total.`, 'info');
                    
                    // Show top prospects
                    if (data.prospects && data.prospects.length > 0) {
                        addLog('Top prospects found:', 'info');
                        data.prospects.slice(0, 5).forEach(p => {
                            addLog(`  • ${p.name} | Fit: ${p.fit_score}/100 | Email: ${p.email || 'none'}`, p.fit_score >= 65 ? 'success' : 'skip');
                        });
                    }
                    
                    progressFill.style.width = '100%';
                    setTimeout(() => {
                        progressBar.style.display = 'none';
                        progressFill.style.width = '0%';
                    }, 1000);
                    
                    refreshLeads();
                } else {
                    addLog(`Error: ${data.error || 'Discovery failed'}`, 'error');
                }
            } catch (e) {
                addLog(`Network error: ${e.message}`, 'error');
            } finally {
                btn.textContent = '🔍 Scout Now';
                btn.disabled = false;
                discovering = false;
            }
        }
        
        async function refreshLeads() {
            try {
                const resp = await fetch(`${API_BASE}/leads`);
                const leads = await resp.json();
                renderLeads(leads);
                updateStats(leads);
            } catch (e) {
                console.error('Failed to load leads:', e);
            }
        }
        
        function renderLeads(leads) {
            const tbody = document.getElementById('leads-tbody');
            if (!leads || leads.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: #64748b; padding: 40px;">No prospects yet. Click "Scout Now" to discover leads.</td></tr>';
                return;
            }
            
            tbody.innerHTML = leads.map(lead => `
                <tr onclick="editLead(${lead.id})">
                    <td><strong>${escapeHtml(lead.name || 'Unknown')}</strong></td>
                    <td><a href="${escapeHtml(lead.website || '#')}" target="_blank" style="color: #38bdf8; text-decoration: none;">${extractDomain(lead.website)}</a></td>
                    <td>${lead.email ? `<a href="mailto:${escapeHtml(lead.email)}" style="color: #38bdf8; text-decoration: none;">${escapeHtml(lead.email)}</a>` : '<span style="color: #64748b;">—</span>'}</td>
                    <td>${lead.phone || '<span style="color: #64748b;">—</span>'}</td>
                    <td><span class="badge badge-gray">${escapeHtml(lead.niche || '—')}</span></td>
                    <td><span class="badge ${getFitBadgeClass(lead.fit_score)}">${lead.fit_score || 0}/100</span></td>
                    <td>${lead.pain_score || 0}</td>
                    <td><span class="badge ${getStatusBadgeClass(lead.status)}">${lead.status || 'new'}</span></td>
                    <td><button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="event.stopPropagation(); contactLead('${escapeHtml(lead.name || '')}')">Contact</button></td>
                </tr>
            `).join('');
        }
        
        function updateStats(leads) {
            const total = leads.length;
            const newCount = leads.filter(l => l.status === 'new').length;
            const avgFit = total > 0 ? Math.round(leads.reduce((sum, l) => sum + (parseInt(l.fit_score) || 0), 0) / total) : 0;
            const qualified = leads.filter(l => parseInt(l.fit_score || 0) >= 65).length;
            
            document.getElementById('total-prospects').textContent = total;
            document.getElementById('new-leads').textContent = newCount;
            document.getElementById('avg-fit').textContent = avgFit;
            document.getElementById('qualified-count').textContent = qualified;
        }
        
        function getFitBadgeClass(score) {
            if (!score) return 'badge-gray';
            if (score >= 80) return 'badge-green';
            if (score >= 65) return 'badge-yellow';
            return 'badge-gray';
        }
        
        function getStatusBadgeClass(status) {
            switch(status) {
                case 'new': return 'badge-blue';
                case 'contacted': return 'badge-yellow';
                case 'responded': return 'badge-green';
                case 'converted': return 'badge-green';
                case 'disqualified': return 'badge-red';
                default: return 'badge-gray';
            }
        }
        
        function extractDomain(url) {
            if (!url) return '—';
            try {
                return new URL(url).hostname.replace(/^www\./, '');
            } catch {
                return url.substring(0, 30);
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function contactLead(name) {
            alert(`Opening outreach for: ${name}\n\nIn production, this would open your email client with a pre-written outreach message.`);
        }
        
        function editLead(id) {
            const newStatus = prompt('Update status (new/contacted/responded/converted/disqualified):');
            if (!newStatus) return;
            
            fetch(`${API_BASE}/leads`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status: newStatus })
            }).then(() => {
                refreshLeads();
            });
        }
        
        async function exportCsv() {
            try {
                const resp = await fetch(`${API_BASE}/export/leads`);
                if (resp.ok) {
                    const blob = await resp.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `prospects_${new Date().toISOString().slice(0,10)}.csv`;
                    a.click();
                    window.URL.revokeObjectURL(url);
                } else {
                    alert('Export failed');
                }
            } catch (e) {
                alert('Export failed: ' + e.message);
            }
        }
        
        // Initial load
        refreshLeads();
        
        // Refresh every 30 seconds
        setInterval(refreshLeads, 30000);
    </script>
</body>
</html>
