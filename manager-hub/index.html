<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnswerFirst AI — Manager Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #0a0a0f; 
            color: #e2e8f0; 
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* Top Navigation */
        .topnav { 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            height: 64px; 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(51, 65, 85, 0.4); 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 0 32px;
            z-index: 1000;
        }
        
        .logo { 
            font-size: 1.2rem; 
            font-weight: 800; 
            color: #f1f5f9; 
            letter-spacing: -0.5px;
        }
        
        .logo-icon {
            width: 32px; 
            height: 32px; 
            background: linear-gradient(135deg, #38bdf8, #0ea5e9); 
            border-radius: 8px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1rem; 
            font-weight: 800; 
            color: #0a0a0f; 
            margin-right: 10px;
        }
        
        .live-indicator {
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 0.8rem; 
            color: #64748b; 
            font-weight: 500;
        }
        
        .live-dot {
            width: 6px; 
            height: 6px; 
            background: #10b981; 
            border-radius: 50%; 
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        /* Main */
        .main { 
            padding: 96px 40px 40px; 
            min-height: 100vh; 
            width: 100%; 
        }
        
        .main-container {
            max-width: 1440px; 
            margin: 0 auto; 
            width: 100%; 
        }
        
        /* Section Title */
        .section-title { 
            font-size: 1.7rem; 
            font-weight: 800; 
            margin-bottom: 24px; 
            color: #f1f5f9; 
            letter-spacing: -0.5px;
        }
        
        /* Cards - Minimalist */
        .card { 
            background: rgba(30, 41, 59, 0.5); 
            border: 1px solid rgba(51, 65, 85, 0.4); 
            border-radius: 16px; 
            padding: 24px; 
            margin-bottom: 20px; 
            backdrop-filter: blur(10px); 
            transition: all 0.3s ease; 
        }
        
        .card:hover {
            border-color: rgba(56, 189, 248, 0.3); 
            transform: translateY(-2px); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); 
        }
        
        .card-title { 
            font-size: 0.75rem; 
            color: #64748b; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 12px; 
            font-weight: 600;
        }
        
        .card-value { 
            font-size: 2.2rem; 
            font-weight: 800; 
            color: #f1f5f9; 
            letter-spacing: -1px;
        }
        
        .card-change { 
            font-size: 0.8rem; 
            margin-top: 8px; 
            font-weight: 500;
        }
        
        .positive { color: #10b981; }
        .negative { color: #ef4444; }
        
        /* Grid */
        .grid-4 { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 16px; 
            margin-bottom: 24px; 
        }
        
        .grid-2 { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            margin-bottom: 24px; 
        }
        
        /* Buttons */
        .btn { 
            padding: 10px 20px; 
            border-radius: 10px; 
            border: none; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 0.85rem; 
            transition: all 0.2s ease; 
            font-family: 'Inter', sans-serif; 
        }
        
        .btn-primary { 
            background: #38bdf8; 
            color: #0a0a0f; 
        }
        
        .btn-primary:hover {
            background: #0ea5e9; 
            transform: translateY(-1px); 
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3); 
        }
        
        .btn-secondary { 
            background: rgba(51, 65, 85, 0.3); 
            color: #e2e8f0; 
            border: 1px solid rgba(51, 65, 85, 0.5); 
        }
        
        .btn-secondary:hover {
            background: rgba(51, 65, 85, 0.5); 
        }
        
        /* Tables - Minimalist */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.85rem; 
        }
        
        th { 
            text-align: left; 
            padding: 14px 12px; 
            color: #64748b; 
            font-weight: 600; 
            border-bottom: 1px solid rgba(51, 65, 85, 0.5); 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        
        td { 
            padding: 14px 12px; 
            border-bottom: 1px solid rgba(30, 41, 59, 0.5); 
        }
        
        tr { 
            cursor: pointer; 
            transition: background 0.2s ease; 
        }
        
        tr:hover { 
            background: rgba(56, 189, 248, 0.05); 
        }
        
        /* Status Badges */
        .badge { 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 600; 
            letter-spacing: 0.3px; 
            white-space: nowrap;
        }
        
        .badge-green { 
            background: rgba(16, 185, 129, 0.15); 
            color: #10b981; 
            border: 1px solid rgba(16, 185, 129, 0.3); 
        }
        
        .badge-yellow { 
            background: rgba(245, 158, 11, 0.15); 
            color: #f59e0b; 
            border: 1px solid rgba(245, 158, 11, 0.3); 
        }
        
        .badge-red { 
            background: rgba(239, 68, 68, 0.15); 
            color: #ef4444; 
            border: 1px solid rgba(239, 68, 68, 0.3); 
        }
        
        .badge-blue { 
            background: rgba(56, 189, 248, 0.15); 
            color: #38bdf8; 
            border: 1px solid rgba(56, 189, 248, 0.3); 
        }
        
        .badge-gray { 
            background: rgba(100, 116, 139, 0.15); 
            color: #94a3b8; 
            border: 1px solid rgba(100, 116, 139, 0.3); 
        }
        
        /* Form Controls */
        .control-panel {
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            align-items: center; 
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex; 
            gap: 10px; 
            align-items: center;
        }
        
        .form-group input, .form-group select {
            padding: 8px 12px; 
            border-radius: 8px; 
            border: 1px solid rgba(51, 65, 85, 0.6); 
            background: rgba(15, 23, 42, 0.7); 
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif; 
            font-size: 0.85rem;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none; 
            border-color: rgba(56, 189, 248, 0.5);
        }
        
        /* Progress */
        .progress-bar {
            width: 100%; 
            height: 4px; 
            background: rgba(51, 65, 85, 0.3); 
            border-radius: 2px; 
            overflow: hidden; 
            margin-top: 12px;
        }
        
        .progress-fill {
            height: 100%; 
            background: linear-gradient(90deg, #38bdf8, #0ea5e9); 
            transition: width 0.3s ease;
        }
        
        /* Log */
        .log {
            background: rgba(15, 23, 42, 0.7); 
            border: 1px solid rgba(51, 65, 85, 0.4); 
            border-radius: 12px; 
            padding: 16px; 
            font-family: 'Courier New', monospace; 
            font-size: 0.8rem; 
            color: #94a3b8; 
            max-height: 300px; 
            overflow-y: auto;
            margin-top: 16px;
        }
        
        .log-entry { 
            margin-bottom: 4px; 
            padding: 2px 0;
        }
        
        .log-success { color: #10b981; }
        .log-skip { color: #f59e0b; }
        .log-error { color: #ef4444; }
        .log-info { color: #38bdf8; }
        
        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(51, 65, 85, 0.6);
            border-radius: 20px;
            padding: 32px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }
        
        .modal-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #f1f5f9;
            letter-spacing: -0.5px;
            flex: 1;
            word-break: break-word;
        }
        
        .modal-close {
            background: rgba(51, 65, 85, 0.3);
            border: 1px solid rgba(51, 65, 85, 0.5);
            color: #94a3b8;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-left: 12px;
        }
        
        .modal-close:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            color: #ef4444;
        }
        
        .modal-section {
            margin-bottom: 20px;
        }
        
        .modal-section-title {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .modal-field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
        }
        
        .modal-field-label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 500;
        }
        
        .modal-field-value {
            font-size: 0.85rem;
            color: #f1f5f9;
            font-weight: 600;
            text-align: right;
            word-break: break-word;
            max-width: 60%;
        }
        
        .modal-field-value a {
            color: #38bdf8;
            text-decoration: none;
        }
        
        .modal-field-value a:hover {
            text-decoration: underline;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(51, 65, 85, 0.4);
        }
        
        .modal-actions .btn {
            flex: 1;
        }

        /* Tabs */
        .tab-group {
            display: flex;
            gap: 8px;
        }
        .tab {
            background: rgba(51, 65, 85, 0.3);
            border: 1px solid rgba(51, 65, 85, 0.5);
            color: #94a3b8;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.5);
            color: #38bdf8;
        }
        .tab:hover {
            background: rgba(51, 65, 85, 0.5);
        }
    </style>
</head>
<body>
    <div class="topnav">
        <div class="logo">
            <span class="logo-icon">A</span>
            AnswerFirst AI — Manager Hub
        </div>
        <div class="live-indicator">
            <span class="live-dot"></span>
            <span id="hub-status">Local hub ready</span>
        </div>
    </div>

    <div class="main">
        <div class="main-container">
            <!-- Stats Section -->
            <h1 class="section-title">Prospecting Dashboard</h1>
            
            <div class="grid-4">
                <div class="card">
                    <div class="card-title">Total Prospects</div>
                    <div class="card-value" id="total-prospects">0</div>
                    <div class="card-change positive">All-time</div>
                </div>
                <div class="card">
                    <div class="card-title">New Leads</div>
                    <div class="card-value" id="new-leads">0</div>
                    <div class="card-change positive">Uncontacted</div>
                </div>
                <div class="card">
                    <div class="card-title">Avg Fit Score</div>
                    <div class="card-value" id="avg-fit">0</div>
                    <div class="card-change positive">Quality score</div>
                </div>
                <div class="card">
                    <div class="card-title">Qualified (65+)</div>
                    <div class="card-value" id="qualified-count">0</div>
                    <div class="card-change positive">Ready to contact</div>
                </div>
            </div>

            <!-- Discovery Control -->
            <div class="card">
                <div class="card-title">Auto Discover Leads</div>
                <div class="control-panel">
                    <div class="form-group">
                        <input type="text" id="niche" placeholder="Niche (comma separated: HVAC, Roofing, Landscaping)" value="restaurant">
                        <input type="text" id="location" placeholder="Location" value="Pico Rivera CA">
                        <input type="number" id="num-results" placeholder="# Results" value="10" min="1" max="50" style="width: 120px;">
                    </div>
                    <button class="btn-primary" id="discover-btn" onclick="startDiscovery()">🔍 Scout Now</button>
                    <button class="btn-outline" id="stop-btn" onclick="stopDiscovery()" style="display:none;">⏹ Stop</button>
                    <button class="btn-secondary" onclick="exportCsv()">📊 Export CSV</button>
                    <button class="btn-secondary" onclick="refreshLeads()">🔄 Refresh</button>
                </div>
                <div class="progress-bar" id="progress-bar" style="display: none;">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
                <div class="log" id="log" style="display: none;"></div>
            </div>

            <!-- Leads Table -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <div class="card-title" style="margin-bottom: 0;">Discovered Prospects</div>
                    <div class="tab-group">
                        <button class="tab active" id="tab-all" onclick="switchTab('all')">All</button>
                        <button class="tab" id="tab-new" onclick="switchTab('new')">New Leads</button>
                        <button class="tab" id="tab-old" onclick="switchTab('old')">Old Leads</button>
                    </div>
                </div>
                <div style="overflow-x: auto;">
                    <table id="leads-table">
                        <thead>
                            <tr>
                                <th>Business</th>
                                <th>Website</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Niche</th>
                                <th>Fit</th>
                                <th>Pain</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="leads-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Lead Detail Modal -->
    <div class="modal-overlay" id="lead-modal" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Lead Details</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body"></div>
            <div class="modal-actions">
                <button class="btn btn-primary" id="modal-contact-btn" onclick="contactCurrentLead()">📧 Contact</button>
                <button class="btn btn-secondary" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:5050/api';
        let discovering = false;
        let currentLead = null;
        let currentTab = 'all';
        
        function addLog(message, type = 'info') {
            const log = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }
        
        async function startDiscovery() {
            if (discovering) return;
            discovering = true;
            
            const btn = document.getElementById('discover-btn');
            const stopBtn = document.getElementById('stop-btn');
            const log = document.getElementById('log');
            const progressBar = document.getElementById('progress-bar');
            const progressFill = document.getElementById('progress-fill');
            const abortController = new AbortController();
            window._discoveryAbort = abortController;
            
            btn.textContent = 'Discovering...';
            btn.disabled = true;
            stopBtn.style.display = 'inline-flex';
            log.style.display = 'block';
            progressBar.style.display = 'block';
            log.innerHTML = '';
            
            const nicheInput = document.getElementById('niche').value || 'restaurant';
            const niches = nicheInput.split(',').map(s => s.trim()).filter(Boolean);
            const location = document.getElementById('location').value || 'Pico Rivera CA';
            const numResults = parseInt(document.getElementById('num-results').value) || 10;
            
            addLog(`Starting discovery: ${niches.join(', ')} in ${location} (${numResults} results per niche)`, 'info');
            
            try {
                const resp = await fetch(`${API_BASE}/discover-leads`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ niches, location, num_results: numResults }),
                    signal: abortController.signal
                });
                
                const data = await resp.json();
                
                if (resp.ok) {
                    addLog(`Discovery complete! Added ${data.added || 0} new prospects.`, 'success');
                    addLog(`Scraped ${data.total_scraped || 0} businesses total.`, 'info');
                    addLog(`Skipped AI: ${data.skipped_ai || 0} | Skipped no contact: ${data.skipped_no_contact || 0}`, 'skip');
                    
                    // Show top prospects
                    if (data.prospects && data.prospects.length > 0) {
                        addLog('Top prospects found:', 'info');
                        data.prospects.slice(0, 5).forEach(p => {
                            addLog(`  • ${p.name} | Fit: ${p.fit_score}/100 | Email: ${p.email || 'none'} | Phone: ${p.phone || 'none'}`, p.fit_score >= 65 ? 'success' : 'skip');
                        });
                    }
                    
                    progressFill.style.width = '100%';
                    setTimeout(() => {
                        progressBar.style.display = 'none';
                        progressFill.style.width = '0%';
                    }, 1000);
                    
                    refreshLeads();
                } else {
                    addLog(`Error: ${data.error || 'Discovery failed'}`, 'error');
                }
            } catch (e) {
                if (e && e.name === 'AbortError') {
                    addLog('Discovery stopped by user.', 'warn');
                } else {
                    addLog(`Network error: ${e ? e.message : 'unknown'}`, 'error');
                }
            } finally {
                btn.textContent = '🔍 Scout Now';
                btn.disabled = false;
                stopBtn.style.display = 'none';
                discovering = false;
            }
            
            window._discoveryAbort = null;
        }
        
        async function stopDiscovery() {
            if (window._discoveryAbort) {
                window._discoveryAbort.abort();
            }
            // Also signal backend to stop
            try {
                await fetch(`${API_BASE}/discovery/stop`, { method: 'POST' });
            } catch (e) {
                // ignore
            }
            addLog('Stopping discovery...', 'warn');
        }
        
        async function refreshLeads() {
            try {
                const endpoints = {
                    all: `${API_BASE}/leads`,
                    new: `${API_BASE}/leads/new`,
                    old: `${API_BASE}/leads/old`
                };
                const resp = await fetch(endpoints[currentTab] || `${API_BASE}/leads`);
                const leads = await resp.json();
                renderLeads(leads);
                updateStats(leads);
            } catch (e) {
                console.error('Failed to load leads:', e);
            }
        }
        
        function renderLeads(leads) {
            const tbody = document.getElementById('leads-tbody');
            if (!leads || leads.length === 0) {
                const label = currentTab === 'new' ? 'No new leads yet.' : currentTab === 'old' ? 'No old leads yet.' : 'No prospects yet. Click "Scout Now" to discover leads.';
                tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: #64748b; padding: 40px;">${label}</td></tr>`;
                return;
            }
            
            tbody.innerHTML = leads.map(lead => `
                <tr onclick="showLeadDetail(${lead.id})">
                    <td><strong>${escapeHtml(lead.name || 'Unknown')}</strong></td>
                    <td><a href="${escapeHtml(lead.website || '#')}" target="_blank" style="color: #38bdf8; text-decoration: none;">${extractDomain(lead.website)}</a></td>
                    <td>${lead.email ? `<a href="mailto:${escapeHtml(lead.email)}" style="color: #38bdf8; text-decoration: none;">${escapeHtml(lead.email)}</a>` : '<span style="color: #64748b;">—</span>'}</td>
                    <td>${lead.phone ? `<a href="tel:${escapeHtml(lead.phone)}" style="color: #38bdf8; text-decoration: none;">${escapeHtml(lead.phone)}</a>` : '<span style="color: #64748b;">—</span>'}</td>
                    <td><span class="badge badge-gray">${escapeHtml(lead.niche || '—')}</span></td>
                    <td><span class="badge ${getFitBadgeClass(lead.fit_score)}">${lead.fit_score || 0}/100</span></td>
                    <td>${lead.pain_score || 0}</td>
                    <td><span class="badge ${getStatusBadgeClass(lead.status)}">${lead.status || 'new'}</span></td>
                    <td><button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="event.stopPropagation(); contactLead('${escapeHtml(lead.name || '')}')">Contact</button></td>
                </tr>
            `).join('');
        }
        
        async function showLeadDetail(leadId) {
            try {
                const resp = await fetch(`${API_BASE}/leads/${leadId}`);
                const lead = await resp.json();
                currentLead = lead;
                
                document.getElementById('modal-title').textContent = lead.name || 'Lead Details';
                document.getElementById('modal-body').innerHTML = `
                    <div class="modal-section">
                        <div class="modal-section-title">Contact Information</div>
                        <div class="modal-field">
                            <span class="modal-field-label">Email</span>
                            <span class="modal-field-value">${lead.email ? `<a href="mailto:${escapeHtml(lead.email)}">${escapeHtml(lead.email)}</a>` : '—'}</span>
                        </div>
                        <div class="modal-field">
                            <span class="modal-field-label">Phone</span>
                            <span class="modal-field-value">${lead.phone ? `<a href="tel:${escapeHtml(lead.phone)}">${escapeHtml(lead.phone)}</a>` : '—'}</span>
                        </div>
                        <div class="modal-field">
                            <span class="modal-field-label">Website</span>
                            <span class="modal-field-value"><a href="${escapeHtml(lead.website || '#')}" target="_blank">${extractDomain(lead.website)}</a></span>
                        </div>
                    </div>
                    <div class="modal-section">
                        <div class="modal-section-title">Qualification</div>
                        <div class="modal-field">
                            <span class="modal-field-label">Niche</span>
                            <span class="modal-field-value"><span class="badge badge-gray">${escapeHtml(lead.niche || '—')}</span></span>
                        </div>
                        <div class="modal-field">
                            <span class="modal-field-label">Fit Score</span>
                            <span class="modal-field-value"><span class="badge ${getFitBadgeClass(lead.fit_score)}">${lead.fit_score || 0}/100</span></span>
                        </div>
                        <div class="modal-field">
                            <span class="modal-field-label">Pain Score</span>
                            <span class="modal-field-value">${lead.pain_score || 0}</span>
                        </div>
                        <div class="modal-field">
                            <span class="modal-field-label">AI Detected</span>
                            <span class="modal-field-value"><span class="badge ${lead.has_ai ? 'badge-red' : 'badge-green'}">${lead.has_ai ? 'Yes' : 'No'}</span></span>
                        </div>
                    </div>
                    <div class="modal-section">
                        <div class="modal-section-title">Status & Notes</div>
                        <div class="modal-field">
                            <span class="modal-field-label">Status</span>
                            <span class="modal-field-value"><span class="badge ${getStatusBadgeClass(lead.status)}">${lead.status || 'new'}</span></span>
                        </div>
                        <div class="modal-field">
                            <span class="modal-field-label">Notes</span>
                            <span class="modal-field-value">${lead.notes ? escapeHtml(lead.notes) : '—'}</span>
                        </div>
                    </div>
                `;
                
                document.getElementById('lead-modal').classList.add('active');
            } catch (e) {
                alert('Failed to load lead details');
            }
        }
        
        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('lead-modal').classList.remove('active');
            currentLead = null;
        }
        
        function contactCurrentLead() {
            if (currentLead) {
                contactLead(currentLead.name);
            }
        }
        
        function updateStats(leads) {
            const total = leads.length;
            const newCount = leads.filter(l => l.status === 'new').length;
            const avgFit = total > 0 ? Math.round(leads.reduce((sum, l) => sum + (parseInt(l.fit_score) || 0), 0) / total) : 0;
            const qualified = leads.filter(l => parseInt(l.fit_score || 0) >= 65).length;
            
            document.getElementById('total-prospects').textContent = total;
            document.getElementById('new-leads').textContent = newCount;
            document.getElementById('avg-fit').textContent = avgFit;
            document.getElementById('qualified-count').textContent = qualified;
        }
        
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            refreshLeads();
        }
        
        function getFitBadgeClass(score) {
            if (!score) return 'badge-gray';
            if (score >= 80) return 'badge-green';
            if (score >= 65) return 'badge-yellow';
            return 'badge-gray';
        }
        
        function getStatusBadgeClass(status) {
            switch(status) {
                case 'new': return 'badge-blue';
                case 'contacted': return 'badge-yellow';
                case 'responded': return 'badge-green';
                case 'converted': return 'badge-green';
                case 'disqualified': return 'badge-red';
                default: return 'badge-gray';
            }
        }
        
        function extractDomain(url) {
            if (!url) return '—';
            try {
                return new URL(url).hostname.replace(/^www\./, '');
            } catch {
                return url.substring(0, 30);
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function contactLead(name) {
            alert(`Opening outreach for: ${name}\n\nIn production, this would open your email client with a pre-written outreach message.`);
        }
        
        // Keyboard shortcut to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
        
        // Initial load
        refreshLeads();
        
        // Refresh every 30 seconds
        setInterval(refreshLeads, 30000);
    </script>
</body>
</html>
