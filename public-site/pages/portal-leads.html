<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnswerFirst AI — Leads</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--bg-alt:#f8fafc;--bg-card:#ffffff;--text:#0f172a;--text-muted:#475569;--border:#e2e8f0;--primary:#0f172a;--accent:#3b82f6;--accent-glow:rgba(59,130,246,0.25);--success:#10b981;--success-glow:rgba(16,185,129,0.25);--shadow:0 4px 20px rgba(0,0,0,0.06);--radius:16px;--transition:0.3s cubic-bezier(0.4,0,0.2,1);}
[data-theme="dark"]{--bg:#0a0a0a;--bg-alt:#0f0f0f;--bg-card:#171717;--text:#ffffff;--text-muted:#a3a3a3;--border:#262626;--primary:#ffffff;--shadow:0 4px 20px rgba(0,0,0,0.4);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background var(--transition),color var(--transition);}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(20px);background:rgba(255,255,255,0.7);border-bottom:1px solid var(--border);transition:all var(--transition);}
[data-theme="dark"] .nav{background:rgba(10,10,10,0.75);}
.nav-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;color:var(--text);text-decoration:none;}
.nav-logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--success));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:0.9rem;}
.nav-links{display:flex;gap:24px;align-items:center;}
.nav-link{color:var(--text-muted);text-decoration:none;font-weight:500;font-size:0.9rem;transition:color var(--transition);}
.nav-link:hover{color:var(--text);}
.nav-link.active{color:var(--accent);}
.theme-toggle{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.main{padding:100px 5% 40px;max-width:1300px;margin:0 auto;}
.page-header{margin-bottom:32px;}
.page-title{font-size:1.75rem;font-weight:800;margin-bottom:4px;}
.page-subtitle{color:var(--text-muted);font-size:0.95rem;}
.table-container{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:14px 16px;font-size:0.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;background:var(--bg-alt);border-bottom:1px solid var(--border);}
td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:0.95rem;}
tr:last-child td{border-bottom:none;}
.badge{padding:4px 12px;border-radius:100px;font-size:0.8rem;font-weight:600;}
.badge-green{background:var(--success-glow);color:var(--success);}
.badge-blue{background:var(--accent-glow);color:var(--accent);}
.badge-gray{background:rgba(100,116,139,0.15);color:var(--text-muted);}
.empty-state{text-align:center;padding:48px;color:var(--text-muted);}
@media(max-width:768px){.nav-links{display:none;}}
.btn{width:auto;padding:12px 24px;border-radius:100px;font-weight:600;font-size:0.95rem;border:none;cursor:pointer;transition:transform var(--transition),box-shadow var(--transition);}
.btn-primary{background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;box-shadow:0 4px 15px var(--accent-glow);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px var(--accent-glow);}
.form-input{padding:10px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg-alt);color:var(--text);font-family:inherit;font-size:0.95rem;}
.form-input:focus{outline:none;border-color:var(--accent);}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-weight:600;margin-bottom:6px;font-size:0.85rem;}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-logo"><div class="nav-logo-icon">A</div><span>AnswerFirst AI</span></a>
  <div class="nav-links">
    <a href="/portal-dashboard.html" class="nav-link">Dashboard</a>
    <a href="/portal-appointments.html" class="nav-link">Appointments</a>
    <a href="/portal-leads.html" class="nav-link active">Leads</a>
    <a href="/portal-billing.html" class="nav-link">Billing</a>
    <a href="/portal-support.html" class="nav-link">Support</a>
    <a href="/portal-calls.html" class="nav-link">Calls</a>
    <a href="/portal-onboarding.html" class="nav-link">Onboarding</a>
    <a href="/portal-documents.html" class="nav-link">Documents</a>
    <a href="/portal-account.html" class="nav-link">Account</a>
    <button class="theme-toggle" id="themeToggle">🌙</button>
    <a href="#" class="nav-link" onclick="document.cookie='portal_token=; Max-Age=0; path=/;
location.href='/portal/login';">Logout</a>
  </div>
</nav>
<div class="main">
  <div class="page-header">
    <h1 class="page-title">Leads</h1>
    <p class="page-subtitle">Manage leads, follow-up sequences, and attribution.</p>
  </div>
  <div style="display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;">
    <button class="btn btn-primary" id="btn-add-lead">+ Add Lead</button>
    <select id="filter-status" class="form-input" style="width:auto;padding:10px 14px;border-radius:100px;">
      <option value="">All Statuses</option>
      <option value="new">New</option>
      <option value="contacted">Contacted</option>
      <option value="qualified">Qualified</option>
      <option value="converted">Converted</option>
      <option value="lost">Lost</option>
    </select>
    <input type="text" id="search-leads" class="form-input" placeholder="Search leads..." style="flex:1;min-width:180px;">
  </div>
  <div class="table-container">
    <table><thead><tr><th>Name</th><th>Email</th><th>Company</th><th>Source</th><th>Score</th><th>Status</th><th>Actions</th></tr></thead><tbody id="leads-body"><tr><td colspan="7" class="empty-state">No leads yet.</td></tr></tbody></table>
  </div>
</div>

<div id="lead-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center;">
  <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:520px;max-height:90vh;overflow:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2 style="font-size:1.1rem;font-weight:700;">Add Lead</h2>
      <button id="close-modal" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text-muted);">✕</button>
    </div>
    <form id="lead-form">
      <div class="form-group"><label class="form-label">Name *</label><input class="form-input" id="l-name" required></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="l-email" type="email"></div>
      <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="l-phone"></div>
      <div class="form-group"><label class="form-label">Company</label><input class="form-input" id="l-company"></div>
      <div class="form-group"><label class="form-label">Source</label><input class="form-input" id="l-source" placeholder="website, ads, referral"></div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="l-notes" rows="3"></textarea></div>
      <button type="submit" class="btn btn-primary">Save Lead</button>
    </form>
  </div>
</div>
<script>
const html=document.documentElement;const toggle=document.getElementById('themeToggle');
const saved=localStorage.getItem('theme');if(saved)html.setAttribute('data-theme',saved);
else if(window.matchMedia('(prefers-color-scheme:dark)').matches)html.setAttribute('data-theme','dark');
toggle.textContent=html.getAttribute('data-theme')==='dark'?'☀️':'🌙';
toggle.addEventListener('click',()=>{const next=html.getAttribute('data-theme')==='dark'?'light':'dark';html.setAttribute('data-theme',next);localStorage.setItem('theme',next);toggle.textContent=next==='dark'?'☀️':'🌙';});
(async()=>{
  try{
    const token = document.cookie.split('; ').find(row=>row.startsWith('portal_token='))?.split('=')[1];
    if(!token) return;
    const headers = {'X-Portal-Token': token};
    const [leadsR, apptsR] = await Promise.all([
      fetch('/portal/api/leads', {headers}).catch(()=>null),
      fetch('/portal/api/appointments', {headers}).catch(()=>null)
    ]);
    const leadsTb = document.getElementById('leads-body');
    const apptsTb = document.getElementById('appt-body');
    if(leadsR && leadsR.ok){
      const leads = await leadsR.json();
      if(!leads.length){ if(leadsTb) leadsTb.innerHTML='<tr><td colspan="5" class="empty-state">No leads yet.</td></tr>'; }
      else {
        if(leadsTb) leadsTb.innerHTML = leads.map(l=>`<tr><td>${l.name||l.business_name||'N/A'}</td><td>${l.email||'N/A'}</td><td>${l.phone||'N/A'}</td><td><span class="badge badge-blue">${l.source||'Web'}</span></td><td><span class="badge badge-green">${l.status||'new'}</span></td></tr>`).join('');
      }
    }
    if(apptsR && apptsR.ok){
      const appts = await apptsR.json();
      if(!appts.length){ if(apptsTb) apptsTb.innerHTML='<tr><td colspan="4" class="empty-state">No appointments scheduled yet.</td></tr>'; }
      else {
        if(apptsTb) apptsTb.innerHTML = appts.map(a=>`<tr><td>${a.scheduled_at||a.created_at?'TBD':'-'}</td><td>${a.customer_name||'N/A'}</td><td>${a.service_type||'Service'}</td><td><span class="badge badge-green">${a.status||'scheduled'}</span></td></tr>`).join('');
      }
    }
  }catch{}
})();
</script>
</body>
</html>
