<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnswerFirst AI — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--bg-alt:#f8fafc;--bg-card:#ffffff;--text:#0f172a;--text-muted:#475569;--border:#e2e8f0;--primary:#0f172a;--accent:#3b82f6;--accent-glow:rgba(59,130,246,0.25);--success:#10b981;--success-glow:rgba(16,185,129,0.25);--shadow:0 4px 20px rgba(0,0,0,0.06);--radius:16px;--transition:0.3s cubic-bezier(0.4,0,0.2,1);}
[data-theme="dark"]{--bg:#0a0a0a;--bg-alt:#0f0f0f;--bg-card:#171717;--text:#ffffff;--text-muted:#a3a3a3;--border:#262626;--primary:#ffffff;--shadow:0 4px 20px rgba(0,0,0,0.4);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;transition:background var(--transition),color var(--transition);}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:48px;width:100%;max-width:480px;box-shadow:var(--shadow);}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;margin-bottom:32px;}
.logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--success));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;}
h1{font-size:1.75rem;font-weight:800;margin-bottom:8px;}
.subtitle{color:var(--text-muted);font-size:0.95rem;margin-bottom:28px;}
.form-group{margin-bottom:20px;}
label{display:block;font-weight:600;margin-bottom:8px;font-size:0.9rem;}
input{width:100%;padding:12px 16px;background:var(--bg-alt);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:1rem;transition:border-color var(--transition);}
input:focus{outline:none;border-color:var(--accent);}
button[type="submit"]{width:100%;padding:14px;border-radius:100px;font-weight:600;font-size:1rem;border:none;cursor:pointer;background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;box-shadow:0 4px 14px var(--accent-glow);transition:all var(--transition);}
button[type="submit"]:hover{transform:translateY(-2px);box-shadow:0 8px 25px var(--accent-glow);}
.footer{margin-top:24px;text-align:center;font-size:0.9rem;color:var(--text-muted);}
.footer a{color:var(--accent);text-decoration:none;font-weight:600;}
.theme-toggle{position:fixed;top:20px;right:20px;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.back-link{display:inline-block;margin-bottom:20px;color:var(--accent);text-decoration:none;font-weight:600;font-size:0.9rem;}
.error-msg{color:#ef4444;font-size:0.9rem;margin-top:8px;display:none;}
</style>
</head>
<a href="/portal-login.html" class="nav-link">Client Portal</a>
<button class="theme-toggle" id="themeToggle">🌙</button>
<a href="/portal-login.html" class="nav-cta">Sign In</a>
<a href="/" class="back-link">← Back to AnswerFirst AI</a>
<div class="card">
  <div class="logo"><div class="logo-icon">A</div><span>Create Account</span></div>
  <h1>Get started</h1>
  <p class="subtitle">Create your client account to access your portal.</p>
  <form id="register-form">
    <div class="form-group"><label>Business Name</label><input type="text" id="reg-business" required></div>
    <div class="form-group"><label>Full Name</label><input type="text" id="reg-name" required></div>
    <div class="form-group"><label>Email</label><input type="email" id="reg-email" required></div>
    <div class="form-group"><label>Phone</label><input type="tel" id="reg-phone"></div>
    <div class="form-group"><label>Password</label><input type="password" id="reg-password" required minlength="6"></div>
    <button type="submit" class="btn btn-primary">Create Account</button>
    <div class="error-msg" id="register-error"></div>
    <div id="verify-banner" style="display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(16,185,129,0.12);color:#047857;font-size:0.9rem;font-weight:600;border:1px solid rgba(16,185,129,0.3);">
      Verify your email—check your inbox.
    </div>
  </form>
  <div class="footer">Already have an account? <a href="/portal-login.html">Log in</a></div>
</div>
<script>
const html=document.documentElement;const toggle=document.getElementById('themeToggle');
const saved=localStorage.getItem('theme');if(saved)html.setAttribute('data-theme',saved);
else if(window.matchMedia('(prefers-color-scheme:dark)').matches)html.setAttribute('data-theme','dark');
toggle.textContent=html.getAttribute('data-theme')==='dark'?'☀️':'🌙';
toggle.addEventListener('click',()=>{const next=html.getAttribute('data-theme')==='dark'?'light':'dark';html.setAttribute('data-theme',next);localStorage.setItem('theme',next);toggle.textContent=next==='dark'?'☀️':'🌙';});
document.getElementById('register-form').addEventListener('submit',async(e)=>{
  e.preventDefault();const err=document.getElementById('register-error');
  try{const r=await fetch('/portal/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({business_name:document.getElementById('reg-business').value,name:document.getElementById('reg-name').value,email:document.getElementById('reg-email').value,phone:document.getElementById('reg-phone').value,password:document.getElementById('reg-password').value})});const j=await r.json();if(r.ok&&j._session_token&&!j.verification_required){window.location.href='/portal-dashboard.html';}else{err.style.display='block';err.textContent=j.error||'Registration failed';if(j.verification_required){const b=document.getElementById('verify-banner');if(b){b.style.display='block';}}}}catch(ex){err.style.display='block';err.textContent='Connection error';}
});
</script>
</body>
</html>
