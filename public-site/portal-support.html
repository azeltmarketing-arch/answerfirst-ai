<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnswerFirst AI — Support</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--bg-alt:#f8fafc;--bg-card:#ffffff;--text:#0f172a;--text-muted:#475569;--border:#e2e8f0;--primary:#0f172a;--accent:#3b82f6;--accent-glow:rgba(59,130,246,0.25);--success:#10b981;--success-glow:rgba(16,185,129,0.25);--shadow:0 4px 20px rgba(0,0,0,0.06);--radius:16px;--transition:0.3s cubic-bezier(0.4,0,0.2,1);}
[data-theme="dark"]{--bg:#0a0a0a;--bg-alt:#0f0f0f;--bg-card:#171717;--text:#ffffff;--text-muted:#a3a3a3;--border:#262626;--primary:#ffffff;--shadow:0 4px 20px rgba(0,0,0,0.4);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background var(--transition),color var(--transition);}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(20px);background:rgba(255,255,255,0.7);border-bottom:1px solid var(--border);transition:all var(--transition);}
[data-theme="dark"] .nav{background:rgba(10,10,10,0.75);}
.nav-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;color:var(--text);text-decoration:none;}
.nav-logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--success));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:0.9rem;}
.nav-links{display:flex;gap:24px;align-items:center;}
.nav-link{color:var(--text-muted);text-decoration:none;font-weight:500;font-size:0.9rem;transition:color var(--transition);}
.nav-link:hover{color:var(--text);}
.nav-link.active{color:var(--accent);}
.theme-toggle{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.main{padding:100px 5% 40px;max-width:1100px;margin:0 auto;}
.page-header{margin-bottom:32px;}
.page-title{font-size:1.75rem;font-weight:800;margin-bottom:4px;}
.page-subtitle{color:var(--text-muted);font-size:0.95rem;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;margin-bottom:20px;}
.form-group{margin-bottom:20px;}
label{display:block;font-weight:600;margin-bottom:8px;font-size:0.9rem;}
input,select,textarea{width:100%;padding:12px 16px;background:var(--bg-alt);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:1rem;transition:border-color var(--transition);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
textarea{min-height:120px;resize:vertical;}
button[type="submit"]{padding:12px 28px;border-radius:100px;font-weight:600;font-size:0.95rem;border:none;cursor:pointer;background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;box-shadow:0 4px 14px var(--accent-glow);transition:all var(--transition);}
button[type="submit"]:hover{transform:translateY(-2px);}
.ticket{border-bottom:1px solid var(--border);padding:16px 0;}
.ticket:last-child{border-bottom:none;}
.ticket-title{font-weight:700;margin-bottom:4px;}
.ticket-meta{font-size:0.85rem;color:var(--text-muted);}
.badge{padding:4px 12px;border-radius:100px;font-size:0.8rem;font-weight:600;}
.badge-green{background:var(--success-glow);color:var(--success);}
.badge-blue{background:var(--accent-glow);color:var(--accent);}
.msg{margin-top:12px;font-size:0.9rem;}
.msg.success{color:var(--success);}
.msg.error{color:#ef4444;}
@media(max-width:768px){.nav-links{display:none;}}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-logo"><div class="nav-logo-icon">A</div><span>AnswerFirst AI</span></a>
  <div class="nav-links">
    <a href="/portal-dashboard.html" class="nav-link">Dashboard</a>
    <a href="/portal-appointments.html" class="nav-link">Appointments</a>
    <a href="/portal-leads.html" class="nav-link">Leads</a>
    <a href="/portal-billing.html" class="nav-link">Billing</a>
    <a href="/portal-support.html" class="nav-link active">Support</a>
    <a href="/portal-calls.html" class="nav-link">Calls</a>
    <a href="/portal-onboarding.html" class="nav-link">Onboarding</a>
    <a href="/portal-documents.html" class="nav-link">Documents</a>
    <a href="/portal-account.html" class="nav-link">Account</a>
    <button class="theme-toggle" id="themeToggle">🌙</button>
    <form method="POST" action="/portal/logout" style="display:inline;"><button type="submit" class="nav-link" style="background:none;border:none;cursor:pointer;font-family:inherit;">Logout</button></form>
  </div>
</nav>
<div class="main">
  <div class="page-header">
    <h1 class="page-title">Support</h1>
    <p class="page-subtitle">We typically reply within 2 hours.</p>
  </div>
  <div class="card">
    <form id="support-form">
      <div class="form-group"><label>Subject</label><input type="text" id="support-subject" required></div>
      <div class="form-group"><label>Category</label><select id="support-category"><option>Technical</option><option>Billing</option><option>Feature Request</option><option>Other</option></select></div>
      <div class="form-group"><label>Message</label><textarea id="support-message" required></textarea></div>
      <button type="submit">Submit Ticket</button>
      <div class="msg" id="support-msg"></div>
    </form>
  </div>
  <div class="card">
    <div class="card-title" style="margin-bottom:12px;">Recent Tickets</div>
    <div class="ticket"><div class="ticket-title">Setup question</div><div class="ticket-meta">Aug 4, 2026 — <span class="badge badge-green">Open</span></div></div>
    <div class="ticket"><div class="ticket-title">Billing inquiry</div><div class="ticket-meta">Aug 1, 2026 — <span class="badge badge-blue">Closed</span></div></div>
  </div>
</div>
<script>
const html=document.documentElement;const toggle=document.getElementById('themeToggle');
const saved=localStorage.getItem('theme');if(saved)html.setAttribute('data-theme',saved);
else if(window.matchMedia('(prefers-color-scheme:dark)').matches)html.setAttribute('data-theme','dark');
toggle.textContent=html.getAttribute('data-theme')==='dark'?'☀️':'🌙';
toggle.addEventListener('click',()=>{const next=html.getAttribute('data-theme')==='dark'?'light':'dark';html.setAttribute('data-theme',next);localStorage.setItem('theme',next);toggle.textContent=next==='dark'?'☀️':'🌙';});
document.getElementById('support-form').addEventListener('submit',async(e)=>{
  e.preventDefault();const msg=document.getElementById('support-msg');
  try{const r=await fetch('/portal/api/tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:document.getElementById('support-subject').value,body:document.getElementById('support-message').value,category:document.getElementById('support-category').value})});const j=await r.json();msg.className='msg '+(r.ok?'success':'error');msg.textContent=j.status==='created'?'Ticket created.':(j.error||'Error');}catch{msg.className='msg error';msg.textContent='Connection error.';}
});
</script>
</body>
</html>
