<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnswerFirst AI — Create Your Account</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap');
  :root{
    --void:#0a0a0f; --bg:#0a0a0f; --bg-card:#111118; --bg-input:#0d0d14;
    --text:#f8fafc; --text-muted:#9a9a9a; --text-dim:#64748b;
    --border:rgba(255,255,255,0.08); --border-focus:rgba(128,82,255,0.5);
    --iris:#8052ff; --iris-glow:rgba(128,82,255,0.25);
    --saffron:#ffb829; --saffron-glow:rgba(255,184,41,0.2);
    --radius:16px; --transition:0.3s cubic-bezier(0.4,0,0.2,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Geist',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .bg-orb{
    position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;
  }
  .bg-orb-1{top:-10%;left:-10%;width:50vw;height:50vw;background:var(--iris);opacity:0.06;}
  .bg-orb-2{bottom:-10%;right:-10%;width:40vw;height:40vw;background:var(--saffron);opacity:0.04;}
  .card{
    position:relative;z-index:1;width:100%;max-width:480px;
    background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
    padding:48px;box-shadow:0 8px 40px rgba(0,0,0,0.5);
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;margin-bottom:32px;color:var(--text);}
  .logo-icon{
    width:36px;height:36px;border-radius:10px;
    background:linear-gradient(135deg,var(--iris),var(--saffron));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:0.85rem;
  }
  h1{font-size:1.75rem;font-weight:700;margin-bottom:8px;letter-spacing:-0.02em;}
  .subtitle{color:var(--text-muted);font-size:0.95rem;margin-bottom:28px;line-height:1.6;}
  .form-group{margin-bottom:20px;}
  label{display:block;font-weight:600;margin-bottom:8px;font-size:0.85rem;color:var(--text-muted);}
  input{
    width:100%;padding:12px 16px;background:var(--bg-input);border:1.5px solid var(--border);
    border-radius:12px;color:var(--text);font-family:inherit;font-size:0.95rem;
    transition:border-color var(--transition),box-shadow var(--transition);
  }
  input:focus{outline:none;border-color:var(--iris);box-shadow:0 0 0 3px var(--iris-glow);}
  button[type="submit"]{
    width:100%;padding:14px;border-radius:100px;font-weight:600;font-size:1rem;border:none;
    cursor:pointer;background:linear-gradient(135deg,var(--iris),#5b21b6);color:#fff;
    box-shadow:0 8px 30px var(--iris-glow);transition:all var(--transition);font-family:inherit;
    margin-top:8px;
  }
  button[type="submit"]:hover{transform:translateY(-2px);box-shadow:0 12px 40px var(--iris-glow);}
  .footer{margin-top:24px;text-align:center;font-size:0.9rem;color:var(--text-muted);}
  .footer a{color:var(--iris);text-decoration:none;font-weight:600;}
  .back-link{display:inline-block;margin-bottom:20px;color:var(--iris);text-decoration:none;font-weight:600;font-size:0.9rem;}
  .error-msg{color:#ef4444;font-size:0.9rem;margin-top:8px;display:none;}
  .success-banner{
    display:none;margin-top:12px;padding:12px;border-radius:12px;
    background:rgba(16,185,129,0.1);color:#10b981;font-size:0.9rem;font-weight:600;
    border:1px solid rgba(16,185,129,0.3);text-align:center;
  }
  .token-info{font-size:0.8rem;color:var(--text-dim);margin-top:16px;text-align:center;}
</style>
</head>
<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <a href="/" class="back-link">← Back to AnswerFirst AI</a>
  <div class="card">
    <div class="logo"><div class="logo-icon">A</div><span>AnswerFirst AI</span></div>
    <h1>Create your account</h1>
    <p class="subtitle">You're one step away from 24/7 AI-powered calls. Create your account to select your plan and complete setup.</p>
    <form id="account-form">
      <div class="form-group"><label>Business Name</label><input type="text" id="business" required placeholder="Your HVAC Company"></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" required minlength="6" placeholder="Min 6 characters"></div>
      <button type="submit">Create Account →</button>
      <div class="error-msg" id="error"></div>
      <div class="success-banner" id="success">✓ Account created! Redirecting to plan selection...</div>
    </form>
    <div class="token-info" id="token-info"></div>
  </div>
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token') || '';
  document.getElementById('token-info').textContent = token ? 'Secure link detected. Please complete your account below.' : 'No token provided.';

  async function loadIntent(){
    if(!token) return;
    try{
      const r = await fetch(`https://answerfirst-ai-backend.onrender.com/portal/api/order-intent/${token}`);
      const j = await r.json();
      if(j.intent){
        const biz = document.getElementById('business');
        if(biz && !biz.value) biz.value = j.intent.company || '';
      }
    }catch(e){}
  }
  loadIntent();

  document.getElementById('account-form').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    errorEl.style.display='none'; successEl.style.display='none';
    try{
      const r = await fetch('https://answerfirst-ai-backend.onrender.com/portal/api/account/create',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          token: token,
          password: document.getElementById('password').value,
          business_name: document.getElementById('business').value,
        })
      });
      const j = await r.json();
      if(!r.ok) throw new Error(j.error || 'Failed');
      successEl.style.display='block';
      setTimeout(()=>{ window.location.href = j.redirect || '/portal-plans.html'; }, 1200);
    }catch(err){
      errorEl.textContent = err.message;
      errorEl.style.display='block';
    }
  });
})();
</script>
</body>
</html>
