<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{--bg:#ffffff;--bg-alt:#f8fafc;--bg-card:#ffffff;--text:#0f172a;--text-muted:#475569;--border:#e2e8f0;--primary:#0f172a;--accent:#3b82f6;--accent-glow:rgba(59,130,246,0.25);--success:#10b981;--success-glow:rgba(16,185,129,0.25);--shadow:0 4px 20px rgba(0,0,0,0.06);--radius:16px;--transition:0.3s cubic-bezier(0.4,0,0.2,1);}
[data-theme="dark"]{--bg:#0a0a0a;--bg-alt:#0f0f0f;--bg-card:#171717;--text:#ffffff;--text-muted:#a3a3a3;--border:#262626;--primary:#ffffff;--shadow:0 4px 20px rgba(0,0,0,0.4);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background var(--transition),color var(--transition);}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(20px);background:rgba(255,255,255,0.7);border-bottom:1px solid var(--border);transition:all var(--transition);}
[data-theme="dark"] .nav{background:rgba(10,10,10,0.75);}
.nav-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;color:var(--text);text-decoration:none;}
.nav-logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--success));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:0.9rem;}
.nav-links{display:flex;gap:24px;align-items:center;}
.nav-link{color:var(--text-muted);text-decoration:none;font-weight:500;font-size:0.9rem;transition:color var(--transition);}
.nav-link:hover{color:var(--text);}
.nav-cta{padding:10px 20px;border-radius:100px;background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;text-decoration:none;font-weight:600;font-size:0.9rem;box-shadow:0 4px 15px var(--accent-glow);}
.theme-toggle{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.main{max-width:1100px;margin:0 auto;padding:120px 5% 60px;text-align:center;}
.hero-title{font-size:3rem;font-weight:800;letter-spacing:-0.03em;line-height:1.1;margin-bottom:16px;}
.hero-subtitle{font-size:1.15rem;color:var(--text-muted);max-width:640px;margin:0 auto 32px;line-height:1.6;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:40px;box-shadow:var(--shadow);text-align:left;max-width:520px;margin:0 auto;}
.form-group{margin-bottom:16px;}
label{display:block;font-weight:600;margin-bottom:6px;font-size:0.9rem;}
input,select,textarea{width:100%;padding:12px 16px;background:var(--bg-alt);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:1rem;transition:border-color var(--transition);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
.btn{width:100%;padding:14px;border-radius:100px;font-weight:600;font-size:1rem;border:none;cursor:pointer;background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;box-shadow:0 4px 15px var(--accent-glow);transition:all var(--transition);}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px var(--accent-glow);}
.error-msg{color:#ef4444;font-size:0.9rem;margin-top:10px;display:none;}
.success-msg{color:#059669;font-size:0.9rem;margin-top:10px;display:none;}
@media(max-width:768px){.nav-links{display:none;}.hero-title{font-size:2rem;}.card{padding:24px;}}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-logo"><div class="nav-logo-icon">A</div><span>AnswerFirst AI</span></a>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/portal-login.html" class="nav-link">Client Portal</a>
    <button class="theme-toggle" id="themeToggle">🌙</button>
  </div>
</nav>
<div class="main">
  <h1 class="hero-title">Get Started Today</h1>
  <p class="hero-subtitle">Tell us about your business and we'll set up your AI receptionist, connect your calendar, and start taking calls.</p>
  <div class="card">
    <form id="capture-form">
      <input type="hidden" id="cap-source" value="">
      <input type="hidden" id="cap-campaign" value="">
      <input type="hidden" id="cap-utm_source" value="">
      <input type="hidden" id="cap-utm_medium" value="">
      <input type="hidden" id="cap-utm_campaign" value="">
      <div class="form-group"><label>Business Name *</label><input type="text" id="cap-business" required></div>
      <div class="form-group"><label>Contact Name *</label><input type="text" id="cap-name" required></div>
      <div class="form-group"><label>Email *</label><input type="email" id="cap-email" required></div>
      <div class="form-group"><label>Phone</label><input type="tel" id="cap-phone"></div>
      <div class="form-group"><label>What service are you interested in?</label>
        <select id="cap-interest">
          <option value="AI Receptionist">AI Receptionist</option>
          <option value="SEO Services">SEO Services</option>
          <option value="Full Package">Full Package</option>
        </select>
      </div>
      <button type="submit" class="btn">Get Started</button>
      <div class="error-msg" id="cap-error"></div>
      <div class="success-msg" id="cap-success">Thanks! We'll be in touch within 24 hours.</div>
    </form>
  </div>
</div>
<script>
const html=document.documentElement;const toggle=document.getElementById('themeToggle');
const saved=localStorage.getItem('theme');if(saved)html.setAttribute('data-theme',saved);
else if(window.matchMedia('(prefers-color-scheme:dark)').matches)html.setAttribute('data-theme','dark');
toggle.textContent=html.getAttribute('data-theme')==='dark'?'☀️':'🌙';
toggle.addEventListener('click',()=>{const next=html.getAttribute('data-theme')==='dark'?'light':'dark';html.setAttribute('data-theme',next);localStorage.setItem('theme',next);toggle.textContent=next==='dark'?'☀️':'🌙';});

(function captureUTM(){
  const urlParams = new URLSearchParams(window.location.search);
  document.getElementById('cap-source').value = urlParams.get('source') || 'landing';
  document.getElementById('cap-campaign').value = urlParams.get('campaign') || '';
  document.getElementById('cap-utm_source').value = urlParams.get('utm_source') || '';
  document.getElementById('cap-utm_medium').value = urlParams.get('utm_medium') || '';
  document.getElementById('cap-utm_campaign').value = urlParams.get('utm_campaign') || '';
})();

document.getElementById('capture-form').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const err = document.getElementById('cap-error');
  const ok = document.getElementById('cap-success');
  err.style.display='none'; ok.style.display='none';
  const data = {
    name: document.getElementById('cap-name').value,
    email: document.getElementById('cap-email').value,
    phone: document.getElementById('cap-phone').value,
    company: document.getElementById('cap-business').value,
    source: document.getElementById('cap-source').value,
    campaign: document.getElementById('cap-campaign').value,
    utm_source: document.getElementById('cap-utm_source').value,
    utm_medium: document.getElementById('cap-utm_medium').value,
    utm_campaign: document.getElementById('cap-utm_campaign').value,
    notes: 'Interest: ' + document.getElementById('cap-interest').value
  };
  try{
    const r = await fetch('/portal/api/public/leads', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
    const j = await r.json();
    if(r.ok){
      ok.style.display='block';
      document.getElementById('capture-form').reset();
    } else {
      err.style.display='block';
      err.textContent = j.error || 'Submission failed';
    }
  }catch(ex){
    err.style.display='block';
    err.textContent='Connection error';
  }
});
</script>
</body>
</html>
